
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteNest - Your Personal Notepad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NoteNest</h1>
        <p>Your personal space for notes</p>
    </header>

    <main>
        <section id="authSection" class="panel">
            <div class="auth-tabs">
                <button id="showLogin" type="button">Sign In</button>
                <button id="showRegister" type="button">Create Account</button>
            </div>

            <form id="loginForm">
                <h2>Welcome back</h2>

                <label for="loginEmail">Email</label>
                <input id="loginEmail" type="email"
                       autocomplete="email" required>

                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password"
                       autocomplete="current-password" required>

                <button type="submit">Sign In</button>
            </form>

            <form id="registerForm" hidden>
                <h2>Create your account</h2>

                <label for="registerEmail">Email</label>
                <input id="registerEmail" type="email"
                       autocomplete="email" required>

                <label for="registerPassword">Password</label>
                <input id="registerPassword" type="password"
                       minlength="12" maxlength="72"
                       autocomplete="new-password" required>

                <p class="hint">Use a password between 12 and 72 characters.</p>

                <button type="submit">Create Account</button>
            </form>

            <p id="authMessage" role="status" aria-live="polite"></p>
        </section>

        <section id="appSection" hidden>
            <div class="account-bar">
                <p>Signed in as <strong id="userEmail"></strong></p>
                <button id="logoutButton" type="button">Sign Out</button>
            </div>

            <section class="panel">
                <h2 id="editorHeading">Create a note</h2>

                <form id="noteForm">
                    <label for="noteTitle">Title</label>
                    <input id="noteTitle" maxlength="255"
                           placeholder="My note" required>

                    <label for="noteContent">Content</label>
                    <textarea id="noteContent" maxlength="100000"
                              placeholder="Write your note here..."
                              required></textarea>

                    <div class="editor-actions">
                        <button id="saveButton" type="submit">Save Note</button>
                        <button id="cancelEdit" type="button" hidden>
                            Cancel Edit
                        </button>
                    </div>
                </form>

                <p id="noteMessage" role="status" aria-live="polite"></p>
            </section>

            <section class="notes-section">
                <h2>My Notes</h2>
                <div id="notesList"></div>
            </section>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
